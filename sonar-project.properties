sonar.projectKey=ubook_app
sonar.projectName=Flutter App
sonar.projectVersion=1.0

sonar.sources=lib
sonar.tests=test
sonar.exclusions=**/*.g.dart, build/**
sonar.sourceEncoding=UTF-8

# Muy importante: apunta al servidor local
# Definir mediante variable CI/CD: SONAR_HOST_URL
# o parámetro CLI: -Dsonar.host.url=$SONAR_HOST_URL